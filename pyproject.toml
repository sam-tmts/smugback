[project]
name = "smugback"
version = "0.1.0"
description = "Back up a SmugMug account's photos and videos to a local folder."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Taylor" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
smugback = "smugback.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Inside the project: the sandbox can write here, and a sandboxed command can't
# tamper with a cache that the owner's unsandboxed terminal shares.
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Defaults plus import sorting, likely bugs and modern-Python upgrades
extend-select = ["I", "B", "UP"]
