[project]
name = "smugback"
version = "0.1.0"
description = "Back up a SmugMug account's photos and videos to a local folder."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samuel Taylor" }]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "oauthlib>=4.0.1",
]

[project.scripts]
smugback = "smugback.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"  # see ADR-0005

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Defaults plus import sorting, likely bugs and modern-Python upgrades
extend-select = ["I", "B", "UP"]
